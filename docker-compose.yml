services:
  # 데이터베이스 (SQLite 사용하므로 필요 없음, 하지만 추후 확장성 위해 포함)
  db:
    image: postgres:16-alpine
    container_name: altsky-db
    environment:
      POSTGRES_DB: altsky
      POSTGRES_USER: altsky
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - altsky-network
    restart: unless-stopped

  # 백엔드 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: altsky-api
    environment:
      DEBUG: ${DEBUG:-0}
      DJANGO_SECRET: ${DJANGO_SECRET:-change-this-to-secure-random-key-in-production}
      HYPIXEL_API_KEY: ${HYPIXEL_API_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,altsky.info,www.altsky.info}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://altsky.info,https://www.altsky.info}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      DATABASE_URL: postgresql://altsky:${DB_PASSWORD:-change-me-in-production}@db:5432/altsky
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - db
    networks:
      - altsky-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 프론트엔드 (SvelteKit preview 서버)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-server
    container_name: altsky-app
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - altsky-network
    restart: unless-stopped

  # Nginx (프론트엔드 + 프록시)
  nginx:
    image: nginx:alpine
    container_name: altsky-web
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - altsky-network
    restart: unless-stopped

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: altsky-tunnel
    command: tunnel --no-autoupdate run --token eyJhIjoiZGZiODUzYzg0YzU4YjU4ZmY3MDQyYWJlZDdmMWIwYTciLCJ0IjoiMTcxZDg0ZTktOTQ4OC00Y2UzLWFlNzctZWFiYmQ2ZGRhNmVkIiwicyI6Ik1UWmhabU01TnpZdE56Y3hOQzAwWmpReUxUaGtNemt0WW1JNVpUSmpaakF3WTJRMyJ9
    depends_on:
      - nginx
    networks:
      - altsky-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  altsky-network:
    driver: bridge
