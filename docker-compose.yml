services:
  # Redis 캐시 - API 응답 캐시로 페이지 로딩 속도 대폭 향상
  redis:
    image: redis:7-alpine
    container_name: altsky-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - altsky-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 데이터베이스 (SQLite 사용하므로 필요 없음, 하지만 추후 확장성 위해 포함)
  db:
    image: postgres:16-alpine
    container_name: altsky-db
    environment:
      POSTGRES_DB: altsky
      POSTGRES_USER: altsky
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - altsky-network
    restart: unless-stopped

  # 백엔드 API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: altsky-api
    env_file:
      - ./backend/.env
    environment:
      DEBUG: ${DEBUG:-0}
      DJANGO_SECRET: ${DJANGO_SECRET:-change-this-to-secure-random-key-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,altsky.info,www.altsky.info}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://altsky.info,https://www.altsky.info}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      DATABASE_URL: postgresql://altsky:${DB_PASSWORD:-change-me-in-production}@db:5432/altsky
      STATSCALC_URL: http://statscalc:8082
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./furfsky_temp:/app/furfsky_temp
    depends_on:
      - db
      - statscalc
      - redis
    networks:
      - altsky-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Statscalc Service (Go)
  statscalc:
    build:
      context: .
      dockerfile: Dockerfile
      target: statscalc
    container_name: altsky-statscalc
    ports:
      - "8082:8082"
    volumes:
      - ./backend/statscalc:/app
    networks:
      - altsky-network
    restart: unless-stopped

  # 프론트엔드 (SvelteKit preview 서버)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-server
    container_name: altsky-app
    ports:
      - "4173:4173"
    depends_on:
      - backend
    networks:
      - altsky-network
    restart: unless-stopped

  # Nginx (프론트엔드 + 프록시)
  nginx:
    image: nginx:alpine
    container_name: altsky-web
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - altsky-network
    restart: unless-stopped

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: altsky-tunnel
    profiles: ["tunnel"]
    # Set CLOUDFLARED_TOKEN in your environment to enable the tunnel.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - altsky-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  altsky-network:
    driver: bridge
