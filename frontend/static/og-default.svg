<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="AltSky preview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="50%" stop-color="#0c162c"/>
      <stop offset="100%" stop-color="#0f1f33"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b7dff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="260" cy="170" r="220" fill="#6b7dff" opacity="0.12"/>
  <circle cx="950" cy="430" r="260" fill="#4fd1c5" opacity="0.1"/>
  <rect x="80" y="120" width="1040" height="390" rx="34" fill="#0b1224" opacity="0.82" stroke="#1b2740" stroke-width="2"/>
  <text x="140" y="230" fill="#e8ecf7" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="92" font-weight="700">AltSky</text>
  <text x="140" y="290" fill="#a9b7d7" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="34" font-weight="500">Hypixel SkyBlock player lookup</text>
  <rect x="140" y="330" width="280" height="56" rx="16" fill="url(#pill)" opacity="0.95"/>
